# Publish the game and the lab to GitHub Pages on every push to main.
#   https://<user>.github.io/<repo>/      -> the game (app/www)
#   https://<user>.github.io/<repo>/lab/  -> the level lab (app/lab)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r app/www/. _site/
          cp -r app/lab _site/lab
          # The lab loads the game's presets from ../www/; on the site the game is at the root.
          sed -i 's#\.\./www/#../#g' _site/lab/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
