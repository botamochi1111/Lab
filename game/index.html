<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incident Flip Walk</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --panel-border: #2d3a4f;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --walkable: #3dd68c;
      --blocked: #4a5568;
      --start: #ffd166;
      --goal: #ff6b6b;
      --accent: #a78bfa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #1a2744 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.35rem;
    }

    .board {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(0, 0, 0, 0.2);
    }

    button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: #243044;
      color: var(--text);
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:hover:not(:disabled) { background: #2f3f58; }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    button.primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-color: transparent;
      font-weight: 600;
    }

    select {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: #243044;
      color: var(--text);
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      max-width: 11rem;
    }

    .toolbar label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem;
      padding: 0.65rem 1rem;
      font-size: 0.88rem;
      border-bottom: 1px solid var(--panel-border);
    }

    .status span { color: var(--muted); }
    .status strong { color: var(--text); }
    .status-win strong { color: var(--walkable); }
    .status-stuck strong { color: var(--goal); }

    .canvas-container {
      width: 100%;
      overflow: auto; /* Allow both horizontal and vertical scrolling */
      max-height: 80vh; /* Prevent container from taking too much viewport height on desktop */
      background: #121a26;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
    }

    #canvas {
      display: block;
      background:
        radial-gradient(circle at 50% 50%, rgba(91, 141, 239, 0.05) 0%, transparent 70%),
        #121a26;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem;
      padding: 0.75rem 1rem 1rem;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .legend-item { display: flex; align-items: center; gap: 0.45rem; }

    .legend-line {
      width: 28px;
      border-top: 3px solid var(--walkable);
    }

    .legend-line.dashed {
      border-top-style: dashed;
      border-color: var(--blocked);
    }

    .vertex-label { pointer-events: none; user-select: none; }
    .edge { transition: stroke 0.35s ease, stroke-dasharray 0.35s ease; }
    .vertex-click { cursor: pointer; }
    .vertex-click:hover circle { filter: brightness(1.12); }
    .vertex-click.disabled { cursor: default; }
    .flip-ring {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      opacity: 0;
      pointer-events: none;
    }
    .flip-ring.animate {
      animation: pulse-ring 0.55s ease-out forwards;
    }
    @keyframes pulse-ring {
      0% { r: var(--ring-start-r, 18px); opacity: 0.85; stroke-width: 3; }
      100% { r: var(--ring-end-r, 42px); opacity: 0; stroke-width: 1; }
    }

  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Incident Flip Walk</h1>
      <p>Every time you land on a vertex, all incident edges flip between walkable and blocked. Move from s to t.</p>
    </header>

    <div class="board">
      <div class="toolbar">
        <label for="levelSelect">Level</label>
        <select id="levelSelect"></select>
        <label for="modeSelect">Mode</label>
        <select id="modeSelect">
          <option value="all" selected>Visit All</option>
          <option value="goal">Reach Goal</option>
        </select>
        <label for="diffSelect" id="diffLabel">Difficulty</label>
        <select id="diffSelect">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="expert">Expert</option>
        </select>
        <label style="display: inline-flex; align-items: center; gap: 0.25rem; cursor: pointer; font-size: 0.85rem; color: var(--muted);">
          <input type="checkbox" id="chkCanRevisit" /> Can Revisit
        </label>
        <button id="btnRandom" class="primary">Random</button>
        <button id="btnUndo" disabled>↩ Undo</button>
        <button id="btnReset">⟲ Reset</button>

      </div>
      <div class="status" id="statusBar">
        <div><span>Level</span> <strong id="levelName">—</strong></div>
        <div><span>Moves</span> <strong id="moveCount">0</strong></div>
        <div><span>Current</span> <strong id="currentVertex">s</strong></div>
        <div id="goalStatus"><span>Goal</span> <strong>t</strong></div>
      </div>
      <div class="canvas-container">
        <svg id="canvas" viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-line"></div> Walkable</div>
        <div class="legend-item"><div class="legend-line dashed"></div> Blocked</div>
        <div class="legend-item"><span style="width:12px;height:12px;border-radius:50%;background:var(--start);display:inline-block"></span> s</div>
        <div class="legend-item" id="legendGoal"><span style="width:12px;height:12px;border-radius:50%;background:var(--goal);display:inline-block"></span> t</div>
      </div>
    </div>
  </div>

  <script src="presets.js"></script>
  <script>
    const svg = document.getElementById("canvas");
    const levelSelect = document.getElementById("levelSelect");
    const modeSelect = document.getElementById("modeSelect");
    const levelNameEl = document.getElementById("levelName");
    const moveCountEl = document.getElementById("moveCount");
    const currentVertexEl = document.getElementById("currentVertex");
    const goalStatusEl = document.getElementById("goalStatus");
    const statusBar = document.getElementById("statusBar");
    const btnUndo = document.getElementById("btnUndo");
    const btnReset = document.getElementById("btnReset");
    const btnRandom = document.getElementById("btnRandom");
    const diffSelect = document.getElementById("diffSelect");
    const diffLabel = document.getElementById("diffLabel");

    function updateControls() {
      const isRand = levelSelect.value === "random" || isRandom;
      if (isRand) {
        diffLabel.style.display = "inline";
        diffSelect.style.display = "inline-block";
      } else {
        diffLabel.style.display = "none";
        diffSelect.style.display = "none";
      }
    }

    let level = null;
    let presetIndex = 0;
    let isRandom = false;
    let state = null;
    let history = [];
    let gameDifficulty = "medium";
    let canRevisit = false;

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function edgeKey(a, b) {
      return a < b ? `${a}|${b}` : `${b}|${a}`;
    }

    function serializePuzzleStructure(lv) {
      const edgeStrings = lv.edges.map(([u, v, w]) => {
        const key = u < v ? `${u}-${v}` : `${v}-${u}`;
        return `${key}:${w}`;
      }).sort();
      return edgeStrings.join(",");
    }

    const recentPuzzles = [];

    function cloneEdges(edges) {
      const m = new Map();
      for (const [u, v, w] of edges) m.set(edgeKey(u, v), w);
      return m;
    }

    function getNeighbors(vertex, edgeMap, lv) {
      const nbs = [];
      for (const [u, v] of lv.edges) {
        if (u === vertex) nbs.push(v);
        else if (v === vertex) nbs.push(u);
      }
      return nbs;
    }

    function isWalkable(u, v, edgeMap) {
      return edgeMap.get(edgeKey(u, v)) === 1;
    }

    function flipIncident(vertex, edgeMap, lv) {
      for (const nb of getNeighbors(vertex, edgeMap, lv)) {
        const k = edgeKey(vertex, nb);
        edgeMap.set(k, edgeMap.get(k) === 1 ? 0 : 1);
      }
    }

    function legalMoves(lv, st) {
      let moves = getNeighbors(st.pos, st.edges, lv).filter((nb) => isWalkable(st.pos, nb, st.edges));
      if (!canRevisit && st.visited) {
        moves = moves.filter((nb) => !st.visited.has(nb));
      }
      return moves;
    }

    let gameMode = modeSelect.value;

    function bfsSolveFrom(lv, st, mode = "goal") {
      const totalVertices = Object.keys(lv.vertices).length;
      const initialVisited = st.visited || new Set([st.pos]);

      // Precompute adjacency list with edge indices
      const adj = {};
      Object.keys(lv.vertices).forEach(id => adj[id] = []);
      lv.edges.forEach(([u, v], idx) => {
        adj[u].push({ to: v, edgeIdx: idx });
        adj[v].push({ to: u, edgeIdx: idx });
      });

      // Create mapping from vertex ID to index for BigInt visited bitmask
      const vertexIndexMap = new Map();
      Object.keys(lv.vertices).forEach((id, idx) => {
        vertexIndexMap.set(id, idx);
      });

      // Precompute BigInt flip masks for each vertex
      const flipMasks = {};
      for (const id of Object.keys(lv.vertices)) {
        let fmask = 0n;
        lv.edges.forEach(([u, v], idx) => {
          if (u === id || v === id) {
            fmask |= (1n << BigInt(idx));
          }
        });
        flipMasks[id] = fmask;
      }

      // Convert initial edges Map to BigInt bitmask
      let startMask = 0n;
      lv.edges.forEach(([u, v], idx) => {
        if (st.edges.get(edgeKey(u, v)) === 1) {
          startMask |= (1n << BigInt(idx));
        }
      });

      // Convert initial visited Set to BigInt bitmask
      let startVisitedMask = 0n;
      for (const vId of initialVisited) {
        startVisitedMask |= (1n << BigInt(vertexIndexMap.get(vId)));
      }

      const targetVisitedMask = (1n << BigInt(totalVertices)) - 1n;

      const queue = [{ 
        pos: st.pos, 
        mask: startMask, 
        visitedMask: startVisitedMask, 
        path: [] 
      }];

      const ser = (pos, mask, visitedMask) => {
        return `${pos}|${mask.toString()}|${visitedMask.toString()}`;
      };

      const seen = new Set([ser(st.pos, startMask, startVisitedMask)]);
      let statesChecked = 0;

      const useDfs = totalVertices >= (mode === "goal" ? 20 : 12);
      const maxStates = useDfs ? 40000 : 8000;
      const maxPathLength = Math.max(100, totalVertices * 2);

      while (queue.length) {
        statesChecked++;
        if (statesChecked > maxStates) return null;

        const cur = useDfs ? queue.pop() : queue.shift();

        if (mode === "goal") {
          if (cur.pos === lv.goal) return cur.path;
        } else {
          if (cur.visitedMask === targetVisitedMask) return cur.path;
        }

        // Enforce path length limit to prevent memory bloat and deep endless cycles
        if (cur.path.length >= maxPathLength) continue;

        const neighbors = adj[cur.pos];
        for (const { to, edgeIdx } of neighbors) {
          const isWalkable = (cur.mask & (1n << BigInt(edgeIdx))) !== 0n;
          if (!isWalkable) continue;

          const toIdx = BigInt(vertexIndexMap.get(to));
          const wasVisited = (cur.visitedMask & (1n << toIdx)) !== 0n;

          // Enforce Can Revisit rule
          if (!canRevisit && wasVisited) continue;

          const nextMask = cur.mask ^ flipMasks[to];
          const nextVisitedMask = cur.visitedMask | (1n << toIdx);

          const key = ser(to, nextMask, nextVisitedMask);
          if (!seen.has(key)) {
            seen.add(key);
            queue.push({
              pos: to,
              mask: nextMask,
              visitedMask: nextVisitedMask,
              path: [...cur.path, to]
            });
          }
        }
      }
      return null;
    }

    function buildLayeredGraph(layerSizes, density = 0.5, hasGoal = true) {
      const layerCount = layerSizes.length;
      const groups = Array.from({ length: layerCount }, () => []);

      groups[0] = ["s"];
      let vid = 1;
      for (let i = 1; i < layerCount - 1; i++) {
        for (let j = 0; j < layerSizes[i]; j++) {
          groups[i].push(`v${vid++}`);
        }
      }
      if (hasGoal) {
        groups[layerCount - 1] = ["t"];
      } else {
        for (let j = 0; j < layerSizes[layerCount - 1]; j++) {
          groups[layerCount - 1].push(`v${vid++}`);
        }
      }

      const ids = groups.flat();
      const layerOf = new Map();
      groups.forEach((g, L) => g.forEach((id) => layerOf.set(id, L)));

      const adj = new Map(ids.map((id) => [id, new Set()]));
      const edgePairs = [];
      const seen = new Set();
      const addEdge = (u, v) => {
        if (u === v) return;
        const k = edgeKey(u, v);
        if (!seen.has(k)) {
          seen.add(k);
          edgePairs.push([u, v]);
          adj.get(u).add(v);
          adj.get(v).add(u);
        }
      };

      // Connect adjacent layers monotonically to prevent crossings
      for (let i = 0; i < layerCount - 1; i++) {
        const L1 = groups[i];
        const L2 = groups[i + 1];
        const m = L1.length;
        const n = L2.length;

        let a = 0, b = 0;
        addEdge(L1[a], L2[b]);
        while (a < m - 1 || b < n - 1) {
          if (a === m - 1) {
            b++;
          } else if (b === n - 1) {
            a++;
          } else {
            if (Math.random() < 0.5) {
              a++;
            } else {
              b++;
            }
          }
          addEdge(L1[a], L2[b]);
        }

        // Add extra non-crossing edges
        const currentEdges = edgePairs.filter(([u, v]) => {
          const lu = layerOf.get(u);
          const lv = layerOf.get(v);
          return (lu === i && lv === i + 1) || (lu === i + 1 && lv === i);
        }).map(([u, v]) => {
          const isUL1 = L1.includes(u);
          const uVal = isUL1 ? u : v;
          const vVal = isUL1 ? v : u;
          return [L1.indexOf(uVal), L2.indexOf(vVal)];
        });

        for (let x = 0; x < m; x++) {
          for (let y = 0; y < n; y++) {
            if (Math.random() < density) {
              const crosses = currentEdges.some(([cx, cy]) => {
                return (x - cx) * (y - cy) < 0;
              });
              if (!crosses) {
                addEdge(L1[x], L2[y]);
                currentEdges.push([x, y]);
              }
            }
          }
        }
      }

      // Add adjacent intra-layer vertical edges
      for (let i = 0; i < layerCount; i++) {
        const L = groups[i];
        for (let j = 0; j < L.length - 1; j++) {
          if (Math.random() < 0.3) {
            addEdge(L[j], L[j + 1]);
          }
        }
      }

      return { ids, adj, edgePairs, groups, layerOf };
    }

    function layoutLayered(groups) {
      const vertices = {};
      const marginX = 90;
      const marginY = 90;
      const layerCount = groups.length;
      const layerSpacing = 140; // Ensure at least 140px spacing between layers
      const width = Math.max(1000 - marginX * 2, (layerCount - 1) * layerSpacing);
      const height = 900 - marginY * 2;

      groups.forEach((g, L) => {
        const baseX = marginX + (layerCount === 1 ? width / 2 : (L / (layerCount - 1)) * width);
        const spacing = g.length > 1 ? height / (g.length + 1) : height / 2;
        g.forEach((id, i) => {
          const baseY = marginY + spacing * (i + 1);
          vertices[id] = {
            x: Math.round(baseX),
            y: Math.round(baseY),
            label: id === "s" ? "s" : id === "t" ? "t" : String(i + 1),
            role: id === "s" ? "start" : id === "t" ? "goal" : null,
          };
        });
      });
      return vertices;
    }

    function bfsPath(adj, start, goal) {
      const queue = [[start]];
      const seen = new Set([start]);
      while (queue.length) {
        const path = queue.shift();
        const cur = path[path.length - 1];
        if (cur === goal) return path;
        for (const nb of shuffle([...adj.get(cur)])) {
          if (!seen.has(nb)) {
            seen.add(nb);
            queue.push([...path, nb]);
          }
        }
      }
      return null;
    }

    function craftSolutionPath(adj) {
      let minLen;
      if (gameDifficulty === "easy") minLen = randInt(3, 5);
      else if (gameDifficulty === "hard") minLen = randInt(8, 14);
      else minLen = randInt(5, 9);

      const path = ["s"];
      let cur = "s";
      const visitCount = new Map([["s", 1]]);
      const maxSteps = gameDifficulty === "hard" ? 40 : 24;

      for (let step = 0; step < maxSteps && path.length < minLen + 3; step++) {
        if (cur === "t" && path.length >= minLen) break;
        const nbs = shuffle([...adj.get(cur)]);
        if (!nbs.length) break;

        let next = null;
        if (path.length < minLen - 1) {
          const toward = nbs.filter((nb) => nb !== "t" || path.length >= minLen - 2);
          const revisit = toward.filter((nb) => (visitCount.get(nb) || 0) > 0);
          if (revisit.length && Math.random() < 0.55) {
            next = revisit[randInt(0, revisit.length - 1)];
          } else if (toward.length) {
            next = toward[randInt(0, toward.length - 1)];
          }
        } else if (cur !== "t") {
          const route = bfsPath(adj, cur, "t");
          if (route && route.length > 1) next = route[1];
        }

        if (!next) next = nbs[randInt(0, nbs.length - 1)];
        path.push(next);
        visitCount.set(next, (visitCount.get(next) || 0) + 1);
        cur = next;
      }

      if (cur !== "t") {
        const tail = bfsPath(adj, cur, "t");
        if (!tail) return null;
        path.push(...tail.slice(1));
      }

      if (path[path.length - 1] !== "t" || path.length < 4) return null;
      const hasRevisit = new Set(path).size < path.length;
      if (!hasRevisit && path.length < 5) return null;
      return path;
    }

    function buildInitialEdgesFromPath(path, edgePairs) {
      const keys = edgePairs.map(([u, v]) => edgeKey(u, v));
      const flipAt = (sigma, vertex) => {
        const next = new Map(sigma);
        for (const [u, v] of edgePairs) {
          if (u === vertex || v === vertex) {
            const k = edgeKey(u, v);
            next.set(k, next.get(k) === 1 ? 0 : 1);
          }
        }
        return next;
      };

      for (let attempt = 0; attempt < 120; attempt++) {
        const threshold = Math.random() * 0.5 + 0.25;
        let sigma = new Map(keys.map((k) => [k, Math.random() < threshold ? 1 : 0]));
        let ok = true;
        for (let i = path.length - 1; i >= 1; i--) {
          sigma = flipAt(sigma, path[i]);
          if (sigma.get(edgeKey(path[i - 1], path[i])) !== 1) {
            ok = false;
            break;
          }
        }
        if (ok) return edgePairs.map(([u, v]) => [u, v, sigma.get(edgeKey(u, v))]);
      }
      return null;
    }

    function scorePuzzle(lv, solution) {
      if (!solution) return -1;
      const len = solution.length;
      if (len < 4 || len > 16) return -1;

      const walkable = lv.edges.filter(([, , w]) => w === 1).length;
      const ratio = walkable / lv.edges.length;
      if (ratio < 0.28 || ratio > 0.72) return -1;

      const unique = new Set(solution).size;
      const revisitBonus = unique < solution.length ? 18 : 0;
      const lenScore = 20 - Math.abs(len - 7) * 3;
      const edgeScore = lv.edges.length >= 7 && lv.edges.length <= 22 ? 8 : 0;
      const startMoves = legalMoves(lv, {
        pos: lv.start,
        edges: cloneEdges(lv.edges),
      }).length;
      if (startMoves === 0) return -1;
      const branchScore = startMoves === 1 ? 4 : startMoves === 2 ? 8 : 3;

      return lenScore + revisitBonus + edgeScore + branchScore;
    }

    function generatePuzzle() {
      let best = null;
      let bestScore = -1;
      const maxAttempts = gameDifficulty === "expert" ? 500 : gameDifficulty === "hard" ? 300 : 150;

      let layerCount;
      let minSize, maxSize;
      
      if (gameMode === "all") {
        // Visit All mode (Hamiltonian Path)
        if (gameDifficulty === "easy") {
          layerCount = 3;
          minSize = 2;
          maxSize = 2;
        } else if (gameDifficulty === "medium") {
          layerCount = 4;
          minSize = 2;
          maxSize = 3;
        } else if (gameDifficulty === "hard") {
          layerCount = 8;
          minSize = 2;
          maxSize = 4; // Up to 32 vertices, 4 columns tall
        } else if (gameDifficulty === "expert") {
          layerCount = 13;
          minSize = 2;
          maxSize = 5; // Up to 65 vertices, 5 columns tall
        }
      } else {
        // Reach Goal mode
        if (gameDifficulty === "easy") {
          layerCount = randInt(3, 4);
          minSize = 1;
          maxSize = 2;
        } else if (gameDifficulty === "medium") {
          layerCount = randInt(5, 6);
          minSize = 2;
          maxSize = 3;
        } else if (gameDifficulty === "hard") {
          layerCount = randInt(9, 12);
          minSize = 2;
          maxSize = 5; // Up to 60 vertices, 5 columns tall
        } else if (gameDifficulty === "expert") {
          layerCount = randInt(14, 16);
          minSize = 3;
          maxSize = 6; // Up to 96 vertices, 6 columns tall
        }
      }

      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const layerSizes = [];
        layerSizes.push(1); // Start layer
        for (let L = 1; L < layerCount - 1; L++) {
          layerSizes.push(randInt(minSize, maxSize));
        }
        layerSizes.push(gameMode === "goal" ? 1 : randInt(minSize, maxSize));

        const graph = buildLayeredGraph(layerSizes, 0.45, gameMode === "goal");
        
        // Random state assignment (0 or 1)
        const edges = graph.edgePairs.map(([u, v]) => {
          return [u, v, Math.random() < 0.45 ? 1 : 0];
        });

        const candidate = {
          name: "Random",
          vertices: layoutLayered(graph.groups),
          edges,
          start: "s",
          goal: gameMode === "goal" ? "t" : null,
        };

        const sig = serializePuzzleStructure(candidate);
        if (recentPuzzles.includes(sig)) {
          continue;
        }

        const solution = bfsSolveFrom(candidate, {
          pos: candidate.start,
          edges: cloneEdges(candidate.edges),
          visited: new Set([candidate.start]),
        }, gameMode);
        
        if (!solution) continue; // Ensure the puzzle is actually solvable under the current mode/options

        const score = scorePuzzle(candidate, solution);
        if (score > bestScore) {
          bestScore = score;
          best = candidate;
          best._optimal = solution.length;
          best._sig = sig;
        }
        if (bestScore >= 25 && best._sig) break;
      }

      if (!best) {
        const currentPresets = gameMode === "goal" ? PRESETS_GOAL : PRESETS_ALL;
        const randomPreset = currentPresets[randInt(0, currentPresets.length - 1)];
        best = JSON.parse(JSON.stringify(randomPreset));
        best.name = "Random";
        best._optimal = null;
        best._sig = serializePuzzleStructure(best);
      }

      if (best._sig) {
        recentPuzzles.push(best._sig);
        if (recentPuzzles.length > 10) {
          recentPuzzles.shift();
        }
      }

      return best;
    }

    function populateLevels() {
      levelSelect.innerHTML = "";
      const currentPresets = gameMode === "goal" ? PRESETS_GOAL : PRESETS_ALL;
      currentPresets.forEach((lv, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = `Level ${i + 1}`;
        levelSelect.appendChild(opt);
      });
      const randomOpt = document.createElement("option");
      randomOpt.value = "random";
      randomOpt.textContent = "Random";
      levelSelect.appendChild(randomOpt);
    }

    function startLevel(lv) {
      level = lv;
      state = {
        pos: lv.start,
        edges: cloneEdges(lv.edges),
        moves: 0,
        won: false,
        visited: new Set([lv.start]),
      };
      history = [];
      btnUndo.disabled = true;
      levelNameEl.textContent = isRandom ? "Random" : `Level ${presetIndex + 1}`;
      updateUI();
      render();
      updateControls();
    }

    function loadPreset(idx) {
      isRandom = false;
      presetIndex = idx;
      levelSelect.value = String(idx);
      const currentPresets = gameMode === "goal" ? PRESETS_GOAL : PRESETS_ALL;
      startLevel(currentPresets[idx]);
    }

    function loadNewPuzzle() {
      btnRandom.disabled = true;
      btnRandom.textContent = "Generating...";
      setTimeout(() => {
        isRandom = true;
        levelSelect.value = "random";
        startLevel(generatePuzzle());
        btnRandom.disabled = false;
        btnRandom.textContent = "Random";
      }, 20);
    }

    function resetCurrent() {
      if (isRandom) startLevel(level);
      else {
        const currentPresets = gameMode === "goal" ? PRESETS_GOAL : PRESETS_ALL;
        startLevel(currentPresets[presetIndex]);
      }
    }

    function pushHistory() {
      history.push({
        pos: state.pos,
        edges: new Map(state.edges),
        moves: state.moves,
        won: state.won,
        visited: new Set(state.visited),
      });
      btnUndo.disabled = false;
    }

    function tryMove(target) {
      if (state.won) return;
      const legal = legalMoves(level, state);
      if (!legal.includes(target)) return;

      pushHistory();
      state.pos = target;
      state.visited.add(target);
      flipIncident(target, state.edges, level);
      state.moves += 1;

      if (gameMode === "goal") {
        state.won = state.pos === level.goal;
      } else {
        const totalVertices = Object.keys(level.vertices).length;
        state.won = state.visited.size === totalVertices;
      }

      updateUI();
      render(target);
    }

    function undo() {
      if (!history.length) return;
      const prev = history.pop();
      state = { 
        ...prev, 
        edges: prev.edges,
        visited: new Set(prev.visited),
      };
      btnUndo.disabled = history.length === 0;
      updateUI();
      render();
    }

    function updateUI() {
      moveCountEl.textContent = state.moves;
      currentVertexEl.textContent = state.pos;
      statusBar.classList.remove("status-win", "status-stuck");

      const legendGoal = document.getElementById("legendGoal");
      if (legendGoal) legendGoal.style.display = gameMode === "all" ? "none" : "flex";

      if (state.won) {
        statusBar.classList.add("status-win");
        goalStatusEl.innerHTML = "<span>Result</span> <strong>Clear!</strong>";
      } else {
        if (gameMode === "goal") {
          goalStatusEl.innerHTML = "<span>Goal</span> <strong>t</strong>";
        } else {
          const totalVertices = Object.keys(level.vertices).length;
          goalStatusEl.innerHTML = `<span>Visited</span> <strong>${state.visited.size}/${totalVertices}</strong>`;
        }
        if (!legalMoves(level, state).length) statusBar.classList.add("status-stuck");
      }
    }

    function render(flipVertex = null) {
      try {
        const legal = state.won ? [] : legalMoves(level, state);
        svg.innerHTML = "";

        // Dynamic rendering sizes based on total vertex count to prevent overlap and congestion
        const totalV = Object.keys(level.vertices).length;
        let nodeRadius = 24;
        let activeNodeRadius = 28;
        let edgeWalkableWidth = 5;
        let edgeBlockedWidth = 3;
        let outerStrokeCurrent = 4;
        let outerStrokeLegal = 3;
        let outerStrokeNormal = 2;
        let labelFontSize = "13";
        
        if (totalV > 65) {
          nodeRadius = 10;
          activeNodeRadius = 13;
          edgeWalkableWidth = 2;
          edgeBlockedWidth = 1;
          outerStrokeCurrent = 2;
          outerStrokeLegal = 1.5;
          outerStrokeNormal = 1;
          labelFontSize = "10";
        } else if (totalV > 40) {
          nodeRadius = 14;
          activeNodeRadius = 17;
          edgeWalkableWidth = 2.8;
          edgeBlockedWidth = 1.8;
          outerStrokeCurrent = 2.5;
          outerStrokeLegal = 2;
          outerStrokeNormal = 1.2;
          labelFontSize = "11";
        } else if (totalV > 15) {
          nodeRadius = 18;
          activeNodeRadius = 22;
          edgeWalkableWidth = 4;
          edgeBlockedWidth = 2.2;
          outerStrokeCurrent = 3.5;
          outerStrokeLegal = 2.5;
          outerStrokeNormal = 1.6;
          labelFontSize = "12";
        }
        
        const playerRadius = Math.round(nodeRadius * 0.38);

        // Set dynamic viewBox and style sizes based on the maximum X and Y coordinates of the vertices
        let maxX = 1000;
        let maxY = 700;
        for (const v of Object.values(level.vertices)) {
          if (v.x > maxX) maxX = v.x;
          if (v.y > maxY) maxY = v.y;
        }
        const svgWidth = maxX + 90; // add marginX (90px)
        const svgHeight = maxY + 90; // add marginY (90px)
        svg.setAttribute("viewBox", `0 0 ${svgWidth} ${svgHeight}`);
        svg.style.width = `${svgWidth}px`;
        svg.style.height = `${svgHeight}px`;

        const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
        defs.innerHTML = `
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        `;
        svg.appendChild(defs);

        const gEdges = document.createElementNS("http://www.w3.org/2000/svg", "g");
        for (const [u, v] of level.edges.map(([a, b]) => [a, b])) {
          const p1 = level.vertices[u];
          const p2 = level.vertices[v];
          const walkable = isWalkable(u, v, state.edges);
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", p1.x);
          line.setAttribute("y1", p1.y);
          line.setAttribute("x2", p2.x);
          line.setAttribute("y2", p2.y);
          line.setAttribute("class", "edge");
          line.setAttribute("stroke", walkable ? "#3dd68c" : "#4a5568");
          line.setAttribute("stroke-width", walkable ? edgeWalkableWidth : edgeBlockedWidth);
          line.setAttribute("stroke-linecap", "round");
          if (!walkable) line.setAttribute("stroke-dasharray", "10 8");
          line.setAttribute("opacity", walkable ? 1 : 0.72);
          gEdges.appendChild(line);
        }
        svg.appendChild(gEdges);



        const gVertices = document.createElementNS("http://www.w3.org/2000/svg", "g");
        for (const [id, v] of Object.entries(level.vertices)) {
          const isCurrent = id === state.pos;
          const isLegal = legal.includes(id);

          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.setAttribute("class", `vertex-click ${isLegal ? "" : "disabled"}`);

          if (flipVertex === id) {
            const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            ring.setAttribute("cx", v.x);
            ring.setAttribute("cy", v.y);
            ring.setAttribute("class", "flip-ring animate");
            ring.style.setProperty("--ring-start-r", `${nodeRadius * 0.75}px`);
            ring.style.setProperty("--ring-end-r", `${nodeRadius * 1.75}px`);
            g.appendChild(ring);
          }

          let role = v.role;
          if (gameMode === "all" && role === "goal") role = null;

          const outer = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          outer.setAttribute("cx", v.x);
          outer.setAttribute("cy", v.y);
          outer.setAttribute("r", isCurrent ? activeNodeRadius : nodeRadius);
          
          let fill = "#5b8def";
          if (gameMode === "goal") {
            if (role === "start") fill = "#ffd166";
            else if (role === "goal") fill = "#ff6b6b";
          } else { // "all" mode (Visited All)
            if (state.visited.has(id)) {
              fill = "#2bb375"; // Green color for visited
            } else if (role === "start") {
              fill = "#ffd166"; // Yellow start
            } else {
              fill = "#5b8def";
            }
          }

          outer.setAttribute("fill", fill);
          outer.setAttribute("stroke", isLegal ? "#3dd68c" : isCurrent ? "#fff" : "#2d3a4f");
          outer.setAttribute("stroke-width", isCurrent ? outerStrokeCurrent : isLegal ? outerStrokeLegal : outerStrokeNormal);
          if (isCurrent) outer.setAttribute("filter", "url(#glow)");
          g.appendChild(outer);

          if (isCurrent) {
            const player = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            player.setAttribute("cx", v.x);
            player.setAttribute("cy", v.y);
            player.setAttribute("r", playerRadius);
            player.setAttribute("fill", "#fff");
            g.appendChild(player);
          }

          // Only render labels for 's' and (in Goal mode) 't'
          let labelText = "";
          if (role === "start") labelText = "s";
          else if (role === "goal" && gameMode === "goal") labelText = "t";

          if (labelText) {
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", v.x);
            text.setAttribute("y", v.y + nodeRadius + 15); // Dynamically offsets labels according to circle radius
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("class", "vertex-label");
            text.setAttribute("fill", "#8b9cb3");
            text.setAttribute("font-size", labelFontSize);
            text.setAttribute("font-weight", "600");
            text.textContent = labelText;
            g.appendChild(text);
          }

          if (isLegal) g.addEventListener("click", () => tryMove(id));
          gVertices.appendChild(g);
        }
        svg.appendChild(gVertices);
      } catch (err) {
        console.error("Render Error:", err);
        svg.innerHTML = `<text x="40" y="80" fill="#ff6b6b" font-family="sans-serif" font-size="16">Render Error: ${err.message}</text>`;
      }
    }

    btnRandom.addEventListener("click", loadNewPuzzle);
    btnUndo.addEventListener("click", undo);
    btnReset.addEventListener("click", resetCurrent);
    levelSelect.addEventListener("change", () => {
      if (levelSelect.value === "random") loadNewPuzzle();
      else loadPreset(Number(levelSelect.value));
    });
    modeSelect.addEventListener("change", () => {
      gameMode = modeSelect.value;
      populateLevels();
      loadPreset(0);
    });
    diffSelect.addEventListener("change", () => {
      gameDifficulty = diffSelect.value;
      if (levelSelect.value === "random" || isRandom) loadNewPuzzle();
    });
    const chkCanRevisit = document.getElementById("chkCanRevisit");
    chkCanRevisit.addEventListener("change", () => {
      canRevisit = chkCanRevisit.checked;
      resetCurrent();
    });

    populateLevels();
    loadPreset(0);
  </script>
</body>
</html>
