<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IFW Lab</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<div id="errBanner" hidden style="background:#fdd;color:#900;padding:6px 10px;font-size:13px;white-space:pre-wrap"></div>
<script>
// Show script errors on the page itself (no developer tools needed).
window.addEventListener("error", function (e) {
  var b = document.getElementById("errBanner");
  b.hidden = false;
  b.textContent += "エラー / Error: " + e.message + (e.filename ? "  (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "") + "\n";
});
</script>
<header class="bar">
  <strong class="brand">IFW LAB</strong> <span class="small" id="labVersion">v2026-09-29f</span>
  <button id="btnLang">English</button>
  <select id="sampleSelect" title="レベルを読み込む"></select>
  <button id="btnNew">新規</button>
  <button id="btnExport">JSON出力</button>
  <button id="btnImport">JSON読込</button>
  <span class="sep"></span>
  <label>モード
    <select id="modeSelect">
      <option value="all">VISIT_ALL(全部通る)</option>
      <option value="goal">REACH_GOAL(S→T)</option>
    </select>
  </label>
  <label class="check"><input type="checkbox" id="chkRevisit"> 再訪あり</label>
</header>

<nav class="tools" id="tools">
  <button data-tool="move" class="active">移動</button>
  <button data-tool="addNode">頂点追加</button>
  <button data-tool="addEdge">辺追加</button>
  <button data-tool="cycleEdge">辺の状態切替</button>
  <button data-tool="subdivide">辺を分割</button>
  <button data-tool="delete">削除</button>
  <button data-tool="setStart">スタート指定</button>
  <button data-tool="setGoal">ゴール指定</button>
  <span class="sep"></span>
  <button id="btnEditUndo" title="Ctrl+Z">元に戻す</button>
  <button id="btnEditRedo" title="Ctrl+Y / Ctrl+Shift+Z">やり直し</button>
  <span class="sep"></span>
  <!-- Usable-edge overlay: hidden for now (code kept; remove "hidden" to bring it back). -->
  <label class="check" hidden><input type="checkbox" id="chkDerived"> 本当に使える辺を表示</label>
  <!-- Hub-door overlay: hidden for now (code kept; remove "hidden" to bring it back). -->
  <label class="check" hidden><input type="checkbox" id="chkDoors"> ハブの扉を表示</label>
</nav>

<main class="layout">
  <section class="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    <p class="hint" id="toolHint"></p>
  </section>

  <aside class="side">
    <div class="tabs" id="tabs">
      <button data-tab="edit" class="active">編集</button>
      <button data-tab="play">プレイ</button>
      <button data-tab="analyze">解析</button>
      <button data-tab="proof">S→T検証</button>
    </div>

    <div class="tab" id="tab-edit">
      <label class="field">名前 <input id="levelName"></label>
      <label class="field">メモ <textarea id="levelNote" rows="4"></textarea></label>
      <div id="editStats" class="stats"></div>
      <div class="legend">
        <div><span class="sw off"></span>初期オフ</div>
        <div><span class="sw on"></span>初期オン</div>
        <div><span class="sw fixed"></span>固定(常に通れる・反転しない)</div>
        <div hidden><span class="sw derived"></span>本当に使える辺(VISIT_ALL・再訪なし)</div>
      </div>
    </div>

    <div class="tab" id="tab-play" hidden>
      <div class="row">
        <button id="btnUndo">1手戻す</button>
        <button id="btnReset">最初から</button>
      </div>
      <div id="playStatus" class="stats"></div>
      <div id="doorList" class="stats" hidden></div>
    </div>

    <div class="tab" id="tab-analyze" hidden>
      <button id="btnAnalyze" class="primary">厳密に解析する</button>
      <div id="analysisOut" class="stats"></div>
      <div class="row" id="solutionControls" hidden>
        <button id="btnSolPrev">◀</button>
        <span id="solStep"></span>
        <button id="btnSolNext">▶</button>
        <button id="btnSolExit">終了</button>
      </div>
      <hr>
      <button id="btnStageTable">ゲームの全ステージの難易度一覧</button>
      <div id="stageTableOut" class="stats"></div>
    </div>

    <div class="tab" id="tab-proof" hidden>
      <p class="small">どんなグラフでも使えるS→Tの全状態探索。</p>
      <button id="btnSTSearch" class="primary">S→T 全状態探索(条件なし)</button>
      <div id="stOut" class="stats"></div>
      <hr>
      <button id="btnPCheck">再訪なしS→T: P判定と全探索を比較</button>
      <div id="proofOut" class="stats"></div>
      <!-- Hub-decomposition lemma tools: hidden for now (code kept; remove "hidden" to bring them back). -->
      <div hidden>
        <div class="small">補題の検証(証明用)</div>
        <button id="btnLemma">補題を検証(そのままのグラフで)</button>
        <button id="btnConform">補題の前提を満たす形に変換</button>
        <div id="proofChecks" class="stats"></div>
      </div>
    </div>
  </aside>
</main>

<dialog id="jsonDialog">
  <textarea id="jsonText" rows="18" spellcheck="false"></textarea>
  <div class="row">
    <button id="btnJsonApply" class="primary">読み込む</button>
    <button id="btnJsonCopy">コピー</button>
    <button id="btnJsonClose">閉じる</button>
  </div>
</dialog>

<script src="../www/presets.js"></script>
<script src="../www/bonus.js"></script>
<script src="lang.js"></script>
<script src="engine.js"></script>
<script src="samples.js"></script>
<script src="lab.js"></script>
<script>
// lab.js sets this as its last statement; if it's missing, lab.js didn't load or stopped partway.
if (!window.IFW_LAB_READY) {
  var b = document.getElementById("errBanner");
  b.hidden = false;
  b.textContent += "lab.js が最後まで実行されていません(読み込み失敗か途中でエラー) / lab.js did not finish loading\n";
}
</script>
</body>
</html>
